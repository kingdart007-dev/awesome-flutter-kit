name: One-time Dart formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Format Dart sources once
        run: dart format .
      - name: Commit formatted Dart sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          if ! git diff --cached --quiet; then
            git commit -m "style: format Dart sources"
            git push
          fi
